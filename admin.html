<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Map Admin</title>
<style>
  :root { --canopy: #0B3B24; --line: #d9d6c8; --paper: #faf8f0; --ink: #1d1d1b; --soft: #6b6b63; --red: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--paper); color: var(--ink); }
  header { background: var(--canopy); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  header h1 { font-size: 1.05rem; margin: 0; }
  header button { background: transparent; color: #fff; border: 1px solid #fff8; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  #login { max-width: 360px; margin: 40px auto; }
  #login h2 { margin-top: 0; }
  label { display: block; font-size: .8rem; color: var(--soft); margin-top: 10px; }
  input, select { width: 100%; padding: 9px 10px; font-size: 16px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  button.primary { background: var(--canopy); color: #fff; border: none; border-radius: 6px; padding: 10px 14px; font-size: .9rem; cursor: pointer; }
  button.primary:disabled { opacity: .5; }
  button.ghost { background: #fff; color: var(--canopy); border: 1px solid var(--canopy); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  button.danger { background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  .err { color: var(--red); font-size: .85rem; min-height: 1.2em; margin-top: 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 10px; border: 1px solid var(--line); background: #fff; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .tabs button.on { background: var(--canopy); color: #fff; border-color: var(--canopy); }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: 1.4fr 1.4fr 110px auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: none; }
  .name { font-weight: 600; font-size: .92rem; }
  .meta { font-size: .75rem; color: var(--soft); }
  .live { display: inline-block; font-size: .65rem; background: #e3f4e8; color: #1b6b3a; border-radius: 8px; padding: 1px 6px; margin-left: 6px; }
  .blocked-row { display: grid; grid-template-columns: 1.5fr 1.5fr auto; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .blocked-row.is-blocked .name { color: var(--red); }
  .actions { display: flex; gap: 6px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 9px 16px; border-radius: 20px; font-size: .85rem; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: .95; }
  @media (max-width: 640px) {
    .row, .blocked-row { grid-template-columns: 1fr; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Campus Map Admin</h1>
  <div><span id="who" style="font-size:.8rem;margin-right:8px"></span><button id="logout" hidden>Sign out</button></div>
</header>

<main>
  <!-- LOGIN -->
  <section id="login" class="card">
    <h2>Admin sign in</h2>
    <form id="login-form">
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <div class="err" id="login-err"></div>
      <button class="primary" type="submit" style="width:100%;margin-top:6px">Sign in</button>
    </form>
  </section>

  <!-- APP -->
  <section id="app" hidden>
    <div class="tabs">
      <button id="tab-rooms" class="on">Rooms (hours &amp; status)</button>
      <button id="tab-paths">Paths (block / unblock)</button>
    </div>

    <div id="panel-rooms" class="card">
      <div class="filters">
        <input id="search" placeholder="Search rooms…">
        <select id="floor" style="max-width:130px">
          <option value="">All floors</option>
          <option value="1">Floor 1</option><option value="2">Floor 2</option>
          <option value="3">Floor 3</option><option value="4">Floor 4</option>
        </select>
      </div>
      <div id="rooms-list"></div>
    </div>

    <div id="panel-paths" class="card" hidden>
      <p style="margin-top:0;font-size:.85rem;color:var(--soft)">
        Blocking a path makes the map avoid it. Visitors get a detour if one exists, or a "no route available" message if not.
      </p>
      <div id="blocks-list"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { ROOM_LIST, BLOCK_LIST } from './room-list.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $ = (id) => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Sign in / out ---------- */
$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('login-err').textContent = '';
  try {
    await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
  } catch (err) {
    $('login-err').textContent = 'Sign in failed. Check your email and password.';
  }
});
$('logout').addEventListener('click', () => signOut(auth));

let started = false;
onAuthStateChanged(auth, (user) => {
  $('login').hidden = !!user;
  $('app').hidden = !user;
  $('logout').hidden = !user;
  $('who').textContent = user ? user.email : '';
  if (user && !started) { started = true; buildRooms(); buildBlocks(); listen(); }
});

/* ---------- Tabs ---------- */
function showTab(name) {
  $('panel-rooms').hidden = name !== 'rooms';
  $('panel-paths').hidden = name !== 'paths';
  $('tab-rooms').classList.toggle('on', name === 'rooms');
  $('tab-paths').classList.toggle('on', name === 'paths');
}
$('tab-rooms').addEventListener('click', () => showTab('rooms'));
$('tab-paths').addEventListener('click', () => showTab('paths'));

/* ---------- Live data from Firestore ---------- */
const roomDocs = {};    // id -> saved override
const blockDocs = {};   // id -> { blocked, reason }
const roomRows = {};    // id -> { row, hours, status, badge, dirty }
const blockRows = {};   // id -> { row, reason, btn, name }

function listen() {
  onSnapshot(collection(db, 'rooms'), (snap) => {
    Object.keys(roomDocs).forEach(k => delete roomDocs[k]);
    snap.forEach(d => { roomDocs[d.id] = d.data(); });
    ROOM_LIST.forEach(r => syncRoomRow(r));
  }, (e) => toast('Could not read rooms: ' + e.message));

  onSnapshot(collection(db, 'blocks'), (snap) => {
    Object.keys(blockDocs).forEach(k => delete blockDocs[k]);
    snap.forEach(d => { blockDocs[d.id] = d.data(); });
    BLOCK_LIST.forEach(b => syncBlockRow(b));
  }, (e) => toast('Could not read paths: ' + e.message));
}

/* ---------- Rooms tab ---------- */
function buildRooms() {
  const list = $('rooms-list');
  ROOM_LIST.forEach((r) => {
    const row = document.createElement('div'); row.className = 'row';

    const info = document.createElement('div');
    const name = document.createElement('div'); name.className = 'name'; name.textContent = r.name;
    const badge = document.createElement('span'); badge.className = 'live'; badge.textContent = 'edited'; badge.hidden = true;
    name.appendChild(badge);
    const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = `Floor ${r.layer}`;
    info.append(name, meta);

    const hours = document.createElement('input'); hours.placeholder = 'Hours';
    const status = document.createElement('select');
    ['Open', 'Close'].forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; status.appendChild(o); });

    const actions = document.createElement('div'); actions.className = 'actions';
    const save = document.createElement('button'); save.className = 'primary'; save.textContent = 'Save';
    const reset = document.createElement('button'); reset.className = 'ghost'; reset.textContent = 'Reset'; reset.title = 'Go back to the built-in hours';
    actions.append(save, reset);

    const state = { row, hours, status, badge, dirty: false };
    hours.addEventListener('input', () => { state.dirty = true; });
    status.addEventListener('change', () => { state.dirty = true; });

    save.addEventListener('click', async () => {
      save.disabled = true;
      try {
        await setDoc(doc(db, 'rooms', r.id), { hours: hours.value.trim(), status: status.value, updated: Date.now() }, { merge: true });
        state.dirty = false; toast(`${r.name} saved`);
      } catch (e) { toast('Save failed: ' + e.message); }
      save.disabled = false;
    });
    reset.addEventListener('click', async () => {
      try { await deleteDoc(doc(db, 'rooms', r.id)); state.dirty = false; syncRoomRow(r, true); toast(`${r.name} reset`); }
      catch (e) { toast('Reset failed: ' + e.message); }
    });

    row.append(info, hours, status, actions);
    list.appendChild(row);
    roomRows[r.id] = state;
    syncRoomRow(r, true);
  });
  $('search').addEventListener('input', filterRooms);
  $('floor').addEventListener('change', filterRooms);
}

function syncRoomRow(r, force) {
  const s = roomRows[r.id]; if (!s) return;
  const saved = roomDocs[r.id];
  s.badge.hidden = !saved;
  if (s.dirty && !force) return;   // don't overwrite what the admin is typing
  s.hours.value = (saved && saved.hours) || r.hours;
  s.status.value = (saved && saved.status) || r.status;
}

function filterRooms() {
  const q = $('search').value.trim().toLowerCase();
  const f = $('floor').value;
  ROOM_LIST.forEach(r => {
    const show = (!q || r.name.toLowerCase().includes(q)) && (!f || String(r.layer) === f);
    roomRows[r.id].row.hidden = !show;
  });
}

/* ---------- Paths tab ---------- */
function buildBlocks() {
  const list = $('blocks-list');
  BLOCK_LIST.forEach((b) => {
    const row = document.createElement('div'); row.className = 'blocked-row';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = b.label;
    const reason = document.createElement('input'); reason.placeholder = 'Reason (optional, shown to visitors)';
    const btn = document.createElement('button');

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        if (blockDocs[b.id] && blockDocs[b.id].blocked) {
          await deleteDoc(doc(db, 'blocks', b.id)); toast('Path reopened');
        } else {
          await setDoc(doc(db, 'blocks', b.id), { blocked: true, reason: reason.value.trim(), updated: Date.now() }); toast('Path blocked');
        }
      } catch (e) { toast('Failed: ' + e.message); }
      btn.disabled = false;
    });

    row.append(name, reason, btn);
    list.appendChild(row);
    blockRows[b.id] = { row, reason, btn };
    syncBlockRow(b);
  });
}

function syncBlockRow(b) {
  const s = blockRows[b.id]; if (!s) return;
  const on = !!(blockDocs[b.id] && blockDocs[b.id].blocked);
  s.row.classList.toggle('is-blocked', on);
  s.btn.textContent = on ? 'Unblock' : 'Block';
  s.btn.className = on ? 'ghost' : 'danger';
  if (on) s.reason.value = blockDocs[b.id].reason || '';
  s.reason.disabled = on;   // to change the reason: unblock, edit, block again
}
</script>
</body>
</html>
